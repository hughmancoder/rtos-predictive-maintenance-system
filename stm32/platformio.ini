; STM32F401CCU6 "Black Pill" — sensor hub
[env:blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc
framework = stm32cube
build_flags = -DHSE_VALUE=25000000U
extra_scripts = pre:hardfp.py
; The platform's default GCC 7.2 is Intel-only; GCC 14 runs natively on Apple Silicon.
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.140201.0

; Flash and debug through the ST-LINK on the Nucleo (SWD).
; Without an ST-LINK, set upload_protocol = dfu: hold BOOT0, tap NRST, release BOOT0, then upload over USB-C.
upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200
