; ESP32-S3 N16R8 — UI and gateway (ESP-IDF framework)
[platformio]
; Keep the standard ESP-IDF layout (main/) so plain idf.py still works too.
src_dir = main

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; N16R8: 16 MB flash. Octal PSRAM is enabled in sdkconfig.defaults.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
